<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sistem Pengolahan Nilai Siswa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root { --primary: #1a56db; --primary-dark: #0f3a8a; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a56db 0%, #0f3a8a 60%, #0a2460 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-wrapper { width: 100%; max-width: 440px; padding: 1rem; }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: rgba(255,255,255,0.7); text-decoration: none;
      font-size: 0.85rem; margin-bottom: 1rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: white; }
    .login-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      padding: 2rem; text-align: center; color: white;
    }
    .login-header .logo-icon { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
    .login-body { padding: 2rem; }
    .role-selector .btn {
      border-radius: 8px; font-size: 0.85rem;
      padding: 0.5rem 0.75rem; transition: all 0.2s;
    }
    .role-selector .btn.active {
      background: var(--primary); border-color: var(--primary);
      color: white; box-shadow: 0 4px 12px rgba(26,86,219,0.4);
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(26,86,219,0.15);
    }
    .btn-login {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none; border-radius: 10px; padding: 0.75rem;
      font-weight: 600; letter-spacing: 0.5px; transition: all 0.2s;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,86,219,0.4); }
    .alert { border-radius: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Tombol kembali ke welcome -->
    <a href="index.html" class="back-link">
      <i class="bi bi-arrow-left"></i> Kembali ke Beranda
    </a>

    <div class="login-card">
      <div class="login-header">
        <i class="bi bi-mortarboard-fill logo-icon"></i>
        <h4 class="mb-0 fw-bold">Sistem Pengolahan Nilai</h4>
        <small class="opacity-75">Masuk ke akun Anda</small>
      </div>

      <div class="login-body">
        <!-- Role Selector -->
        <div class="mb-4">
          <p class="text-muted small mb-2 fw-semibold">Masuk sebagai:</p>
          <div class="role-selector d-flex gap-2">
            <button class="btn btn-outline-primary flex-fill active" onclick="setRole('admin', this)">
              <i class="bi bi-shield-lock me-1"></i> Admin
            </button>
            <button class="btn btn-outline-primary flex-fill" onclick="setRole('guru', this)">
              <i class="bi bi-person-workspace me-1"></i> Guru
            </button>
            <button class="btn btn-outline-primary flex-fill" onclick="setRole('siswa', this)">
              <i class="bi bi-person-badge me-1"></i> Siswa
            </button>
          </div>
        </div>

        <!-- Alert -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <!-- Form -->
        <div class="mb-3">
          <label id="identifier-label" class="form-label fw-semibold small">Username</label>
          <div class="input-group">
            <span class="input-group-text" id="identIcon"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="identifier" placeholder="Masukkan username" autocomplete="off" />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold small">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Masukkan password" />
            <button class="btn btn-outline-secondary" type="button" onclick="togglePw()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-login btn-primary w-100 text-white" onclick="doLogin()" id="btnLogin">
          <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
        </button>

        <p class="text-center text-muted mt-3 mb-0" style="font-size:.8rem">
          © 2025 Sistem Nilai Siswa — LSP Skema Programmer
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let selectedRole = 'admin';

    function setRole(role, btn) {
      selectedRole = role;
      document.querySelectorAll('.role-selector .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const labelMap = { admin: 'Username', guru: 'ID Guru', siswa: 'NIS (Nomor Induk Siswa)' };
      const iconMap  = { admin: 'bi-person', guru: 'bi-id-card', siswa: 'bi-123' };
      const phMap    = { admin: 'Masukkan username', guru: 'Contoh: GRU001', siswa: 'Contoh: 2024001' };
      document.getElementById('identifier-label').textContent = labelMap[role];
      document.getElementById('identIcon').innerHTML = `<i class="bi ${iconMap[role]}"></i>`;
      document.getElementById('identifier').placeholder = phMap[role];
      document.getElementById('identifier').value = '';
      hideAlert();
    }

    function togglePw() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') { pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
    }

    function showAlert(msg, type = 'danger') {
      const box = document.getElementById('alertBox');
      box.className = `alert alert-${type}`;
      box.textContent = msg;
      box.classList.remove('d-none');
    }
    function hideAlert() { document.getElementById('alertBox').classList.add('d-none'); }

    async function doLogin() {
      const identifier = document.getElementById('identifier').value.trim();
      const password   = document.getElementById('password').value.trim();
      const btn        = document.getElementById('btnLogin');

      if (!identifier) { showAlert('Mohon isi ' + document.getElementById('identifier-label').textContent + '.'); return; }
      if (!password)   { showAlert('Mohon isi password.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';
      hideAlert();

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, role: selectedRole }),
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showAlert('Login berhasil! Mengalihkan...', 'success');
          const redirectMap = {
            admin: 'admin/dashboard.html',
            guru:  'guru/dashboard.html',
            siswa: 'siswa/dashboard.html'
          };
          setTimeout(() => { window.location.href = redirectMap[selectedRole]; }, 800);
        } else {
          showAlert(data.message || 'Login gagal. Periksa kembali identitas dan password Anda.');
        }
      } catch (err) {
        showAlert('Tidak dapat terhubung ke server. Pastikan server sedang berjalan.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk';
      }
    }

    // Enter key support
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

    // Jika sudah login, langsung ke dashboard
    const existingUser = localStorage.getItem('user');
    if (existingUser) {
      const u = JSON.parse(existingUser);
      const redirectMap = { admin: 'admin/dashboard.html', guru: 'guru/dashboard.html', siswa: 'siswa/dashboard.html' };
      if (redirectMap[u.role]) window.location.href = redirectMap[u.role];
    }
  </script>
</body>
</html>
